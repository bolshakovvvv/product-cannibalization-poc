services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cannibalization
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cannibalization"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cannibalization
      DB_USER: app
    volumes:
      - ./releases/initial/back.jar:/app/back.jar:ro
    command: ["java", "-jar", "/app/back.jar"]
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./releases/initial/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data: