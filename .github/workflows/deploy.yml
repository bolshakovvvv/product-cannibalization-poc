name: Deploy prototype

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "backend/**"
      - "frontend/**"
      - "deploy/**"

permissions:
  contents: read

concurrency:
  group: prototype-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend
        working-directory: backend/back
        run: bash ./gradlew --no-daemon bootJar

      - name: Prepare release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

          mkdir -p package/frontend
          cp -a frontend/dist/. package/frontend/

          mapfile -t jars < <(
            find backend/back/build/libs -maxdepth 1 \
              -type f -name '*.jar' ! -name '*-plain.jar'
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one application JAR"
            exit 1
          fi

          cp "${jars[0]}" package/back.jar
          cp deploy/compose.yaml deploy/nginx.conf deploy/deploy.sh package/
          printf '%s\n' "$RELEASE_ID" > package/frontend/release.txt
          tar -czf release.tar.gz -C package .

      - name: Configure SSH
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload and deploy
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        timeout-minutes: 8
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTIONS=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${SSH_OPTIONS[@]}" "$TARGET" \
            "mkdir -p ~/nis/releases/$RELEASE_ID"

          scp "${SSH_OPTIONS[@]}" release.tar.gz \
            "$TARGET:nis/releases/$RELEASE_ID/release.tar.gz"

          ssh "${SSH_OPTIONS[@]}" "$TARGET" \
            "cd ~/nis/releases/$RELEASE_ID \
            && tar -xzf release.tar.gz \
            && sed -i 's/\r$//' deploy.sh \
            && bash deploy.sh '$RELEASE_ID'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key